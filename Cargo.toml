[package]
name = "rlv-forge"
version = "0.1.0"
edition = "2021"
description = "RLV Forge: native GPX editing and video alignment for indoor cycling"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.17.2"
roxmltree = "0.21.1"
walkers = "0.63.0"
directories = "6"
env_logger = "0.11"
time = { version = "0.3", features = ["parsing", "formatting"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
