[package]
name = "rlv-forge"
version = "0.1.2"
edition = "2021"
description = "RLV Forge: native GPX/FIT import, route editing and video alignment for indoor cycling"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.17.2"
roxmltree = "0.21.2"
fitparser = "0.12.0"
walkers = "0.65.0"
directories = "6"
env_logger = "0.11"
time = { version = "0.3", features = ["parsing", "formatting"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
uuid = { version = "1.29.0", features = ["v4"] }
zip = { version = "9.3.0", default-features = false }

[profile.release]
lto = "thin"
